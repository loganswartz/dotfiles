general.import = ["/home/logans/.alacritty.d/alacritty.toml"]

[colors.bright]
black = "#292929"
red = "#f59a92"
green = "#72cc9e"
yellow = "#b4bf6a"
blue = "#7ebbfa"
magenta = "#bba8f5"
cyan = "#4dcad7"
white = "#dedede"

[colors.normal]
black = "#181818"
red = "#ca736d"
green = "#49a478"
yellow = "#8d9742"
blue = "#5894d0"
magenta = "#9481cb"
cyan = "#08a2af"
white = "#b8b8b8"

[colors.primary]
background = "#181818"
foreground = "#9c9c9c"

[colors]
# fix transparency for things like floating windows in neovim
transparent_background_colors = true

[font]
size = 13.0

[font.normal]
family = "Mononoki Nerd Font Mono"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true
mods = "None"

[window]
dynamic_padding = true
dynamic_title = true
opacity = 0.75

[window.padding]
x = 4
y = 4
